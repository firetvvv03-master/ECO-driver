        /* ==========================================================================
           WEB AUDIO API SOUND GENERATOR
           ================================================================---------- */
        class SoundManager {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq = 400, type = 'sine', duration = 0.1) {
                if (!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playCollect() { this.playTone(650, 'triangle', 0.12); }
            playUpgrade() { this.playTone(880, 'sine', 0.25); }
            playPowerup() { this.playTone(950, 'square', 0.3); }
            playBossAlert() { this.playTone(180, 'sawtooth', 0.5); }
            playShoot() { this.playTone(520, 'square', 0.08); }
            playLaunch() { 
                if (!this.enabled) return;
                this.init();
                const notes = [200, 300, 450, 600];
                notes.forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.15), i * 80));
            }
        }

        /* ==========================================================================
           PARTICLE SYSTEM
           ================================================================---------- */
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            emit(x, y, color, count = 10, speed = 3) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * speed + 0.5;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - 0.5,
                        radius: Math.random() * 3 + 1.5,
                        color: color,
                        alpha: 1,
                        decay: Math.random() * 0.03 + 0.02
                    });
                }
            }

            update() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                for (let p of this.particles) {
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            clear() { this.particles = []; }
        }

            setupCanvasSize() {
                const container = this.canvas.parentElement;
                this.width = container.clientWidth || 360;
                this.height = container.clientHeight || 520;
                this.canvas.width = this.width * window.devicePixelRatio;
                this.canvas.height = this.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                
                if (this.state === 'BASE') {
                    this.sub.x = this.width / 2;
                    this.sub.y = this.height / 2;
                    this.sub.targetX = this.width / 2;
                    this.sub.targetY = this.height / 2;
                }
            }

            setupListeners() {
                window.addEventListener('resize', () => this.setupCanvasSize());

                const handleMove = (clientX, clientY) => {
                    if (this.state !== 'DIVING') return;
                    const rect = this.canvas.getBoundingClientRect();
                    this.sub.targetX = Math.max(30, Math.min(this.width - 30, clientX - rect.left));
                    this.sub.targetY = Math.max(50, Math.min(this.height - 50, clientY - rect.top));
                };

                this.canvas.addEventListener('pointerdown', (e) => {
                    handleMove(e.clientX, e.clientY);
                    if (this.state === 'DIVING') {
                        this.shootWeapon();
                    }
                });

                this.canvas.addEventListener('pointermove', (e) => {
                    if (e.buttons > 0) handleMove(e.clientX, e.clientY);
                });

                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && this.state === 'DIVING') {
                        this.shootWeapon();
                        e.preventDefault();
                    }
                });
            }

            shootWeapon() {
                if (this.shootCooldown > 0) return;
                this.shootCooldown = 12; // rate limiter frames
                let w = this.weapons[this.currentWeapon];
                
                this.playerProjectiles.push({
                    x: this.sub.x,
                    y: this.sub.y - 15,
                    vx: 0,
                    vy: -w.speed,
                    radius: w.style === 'railgun' || w.style === 'annihilator' ? 8 : 5,
                    damage: w.damage,
                    color: w.color,
                    style: w.style,
                    isPet: false
                });
                this.particles.emit(this.sub.x, this.sub.y - 20, w.color, 8, 4);
                this.sound.playShoot();
            }

            startIdleLoop() {
                setInterval(() => {
                    if (this.state === 'BASE' && this.upgrades.collectorBot.level > 0) {
                        const earned = this.upgrades.collectorBot.level * 2;
                        this.trash += earned;
                        this.updateHUD();
                    }
                }, 2000);
            }

            updateHUD() {
                document.getElementById('trash-count').innerText = this.trash;
                document.getElementById('health-count').innerText = this.health;
                document.getElementById('station-level-text').innerText = `Research Level ${this.stationLevel}`;

                let puredEl = document.getElementById('powerup-hud');
                if (puredEl) {
                    puredEl.innerHTML = '';
                    if (this.magnetTimer > 0) {
                        puredEl.innerHTML += `<div class="bg-cyan-900/80 border border-cyan-400 text-cyan-200 px-2.5 py-1 rounded-xl text-[10px] font-bold animate-pulse">🧲 MAGNET (${Math.ceil(this.magnetTimer)}s)</div>`;
                    }
                    if (this.timeSlowTimer > 0) {
                        puredEl.innerHTML += `<div class="bg-purple-900/80 border border-purple-400 text-purple-200 px-2.5 py-1 rounded-xl text-[10px] font-bold animate-pulse">⏱️ TIME SLOW (${Math.ceil(this.timeSlowTimer)}s)</div>`;
                    }
                    if (Math.abs(this.currentDrift) > 0.05) {
                        let dir = this.currentDrift > 0 ? '➡️ RIGHT' : '⬅️ LEFT';
                        puredEl.innerHTML += `<div class="bg-blue-900/80 border border-blue-400 text-blue-200 px-2.5 py-1 rounded-xl text-[10px] font-bold animate-pulse">🌊 STRONG TRENCH CURRENT (${dir})</div>`;
                    }
                }
            }

            addPopup(text, x, y, color = '#38bdf8') {
                this.popups.push({ text: text, x: x, y: y, color: color, alpha: 1.0 });
            }

            updateQuest(id, progress) {
                let q = this.quests.find(x => x.id === id);
                if (q && !q.completed) {
                    q.current = Math.min(q.target, q.current + progress);
                    if (q.current >= q.target) {
                        q.completed = true;
                        this.trash += q.reward;
                        this.sound.playUpgrade();
                    }
                }
            }

            triggerSkill() {
                if (!this.skillReady || this.state !== 'DIVING') return;
                
                this.skillReady = false;
                this.shieldActive = true;
                this.sound.playTone(750, 'sine', 0.4);
                
                let blastRadius = 140 + (this.upgrades.sonarPower.level * 20);
                this.sonarShockwaves.push({
                    x: this.sub.x,
                    y: this.sub.y,
                    currentRadius: 10,
                    maxRadius: blastRadius,
                    alpha: 1.0
                });

                this.particles.emit(this.sub.x, this.sub.y, '#fbbf24', 35, 8);
                this.updateQuest('use_skill', 1);

                for (let i = this.entities.length - 1; i >= 0; i--) {
                    let ent = this.entities[i];
                    let dist = Math.hypot(this.sub.x - ent.x, this.sub.y - ent.y);
                    if (dist <= blastRadius + ent.radius) {
                        if (ent.type.startsWith('trash')) {
                            let multiplier = (this.currentPet === 'gold_bot' && ent.type === 'trash_chest') ? 2 : 1;
                            let earned = ent.value * 2 * multiplier;
                            this.trash += earned;
                            this.addPopup(`+${earned} ♻️`, ent.x, ent.y, '#38bdf8');
                            this.updateQuest('collect_trash', 1);
                            this.particles.emit(ent.x, ent.y, '#38bdf8', 15, 5);
                        } else if (ent.type.startsWith('creature') || ent.type.startsWith('hazard') || ent.type.startsWith('enemy')) {
                            this.particles.emit(ent.x, ent.y, '#f43f5e', 20, 6);
                        } else if (ent.type.startsWith('powerup')) {
                            if (ent.type === 'powerup_magnet') this.magnetTimer = 8;
                            else this.timeSlowTimer = 8;
                        }
                        this.entities.splice(i, 1);
                        this.spawnEntity();
                    }
                }

                if (this.bossActive) {
                    let bossDist = Math.hypot(this.sub.x - this.boss.x, this.sub.y - this.boss.y);
                    if (bossDist <= blastRadius + 100) {
                        let damageAmount = 35 + (this.upgrades.sonarPower.level * 10);
                        this.boss.health = Math.max(0, this.boss.health - damageAmount);
                        this.addPopup(`-${damageAmount} HP`, this.boss.x, this.boss.y, '#f43f5e');
                        this.particles.emit(this.boss.x, this.boss.y, '#f43f5e', 40, 8);
                        this.sound.playBossAlert();
                    }
                }

                setTimeout(() => { this.shieldActive = false; }, 2000);

                this.skillCooldownTimer = 6;
                const cdEl = document.getElementById('skill-cooldown');
                if (cdEl) cdEl.innerText = `${this.skillCooldownTimer}s`;
                
                const cdInterval = setInterval(() => {
                    this.skillCooldownTimer--;
                    if (cdEl) cdEl.innerText = `${this.skillCooldownTimer}s`;
                    if (this.skillCooldownTimer <= 0) {
                        this.skillReady = true;
                        if (cdEl) cdEl.innerText = 'Ready';
                        clearInterval(cdInterval);
                    }
                }, 1000);

                this.updateHUD();
            }

            startDive() {
                if (this.health <= 25) {
                    this.showModal("Hull Integrity Low!", "Repair your submarine's health at the station before diving!", "Okay", () => this.closeModal());
                    return;
                }
                
                this.state = 'DIVING';
                this.diveTimer = this.maxDiveTime + (this.currentPet === 'solar_bird' ? 15 : 0);
                this.maxDiveTime = 90;
                this.currentDepth = 0;
                this.combo = 0;
                this.comboMultiplier = 1;
                this.entities = [];
                this.popups = [];
                this.playerProjectiles = [];
                this.bossActive = false;
                this.bossProjectiles = [];
                this.bossDefeatedDepths.clear();
                this.magnetTimer = 0;
                this.timeSlowTimer = 0;
                this.inkCloudAlpha = 0;
                
                this.currentDrift = (Math.random() - 0.5) * 2.8;

                this.sound.playLaunch();
                
                document.getElementById('dive-btn').classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('dive-hud').style.opacity = '1';
                document.getElementById('skill-container').classList.remove('hidden');

                for (let i = 0; i < 12; i++) {
                    this.spawnEntity();
                }

                if (this.timerInterval) clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    if (this.state === 'DIVING') {
                        this.diveTimer--;
                        this.currentDepth += 20;
                        document.getElementById('timer-text').innerText = `${this.diveTimer}s`;
                        document.getElementById('depth-text').innerText = `Depth: ${this.currentDepth}m`;

                        // Pet passive health regen perk
                        if (this.currentPet === 'sakura_spirit' && this.diveTimer % 15 === 0) {
                            this.health = Math.min(this.maxHealth, this.health + 5);
                            this.addPopup(`+5 HP (Sakura)`, this.sub.x, this.sub.y - 30, '#f472b6');
                            this.updateHUD();
                        }

                        if (this.diveTimer % 12 === 0) {
                            this.currentDrift = (Math.random() - 0.5) * 2.8;
                        }

                        this.checkBossSpawn();

                        if (this.diveTimer <= 0 || this.health <= 0) {
                            this.endDive();
                        }
                    }
                }, 1000);

                this.updateHUD();
            }

            checkBossSpawn() {
                if (this.bossActive) return;
                for (let b of this.bossDatabase) {
                    if (this.currentDepth >= b.depth && !this.bossDefeatedDepths.has(b.depth)) {
                        this.spawnBoss(b);
                        break;
                    }
                }
            }

            spawnBoss(bossData) {
                this.bossActive = true;
                this.boss = {
                    x: this.width / 2,
                    y: -80,
                    targetY: 90,
                    health: bossData.health,
                    maxHealth: bossData.maxHealth,
                    attackTimer: 0,
                    data: bossData
                };
                this.bossProjectiles = [];
                this.sound.playBossAlert();
                
                let warningBanner = document.getElementById('boss-warning');
                let warningName = document.getElementById('boss-warning-name');
                if (warningName) warningName.innerText = `${bossData.name} (${bossData.depth}m)`;
                
                if (warningBanner) {
                    warningBanner.classList.remove('hidden');
                    warningBanner.classList.add('flex');
                    setTimeout(() => {
                        warningBanner.classList.add('hidden');
                        warningBanner.classList.remove('flex');
                    }, 3000);
                }
            }

            spawnEntity() {
                const types = [
                    'trash_bottle', 'trash_can', 'trash_chest', 
                    'hazard_mine', 'hazard_waste', 
                    'creature_squid', 'creature_angler',
                    'enemy_eel', 'enemy_urchin',
                    'powerup_magnet', 'powerup_timeslow', 'powerup_repair'
                ];
                const weights = [0.28, 0.22, 0.10, 0.04, 0.04, 0.06, 0.06, 0.04, 0.04, 0.05, 0.05, 0.02];
                let rand = Math.random();
                let chosenType = 'trash_bottle';
                let acc = 0;
                for (let i = 0; i < types.length; i++) {
                    acc += weights[i];
                    if (rand <= acc) {
                        chosenType = types[i];
                        break;
                    }
                }

                const isCreature = chosenType.startsWith('creature') || chosenType.startsWith('enemy');
                const isTrash = chosenType.startsWith('trash');
                const isPowerup = chosenType.startsWith('powerup');
                const isChest = chosenType === 'trash_chest';
                const isEel = chosenType === 'enemy_eel';

                this.entities.push({
                    type: chosenType,
                    x: Math.random() * (this.width - 80) + 40,
                    y: this.height + Math.random() * 200 + 50,
                    speed: isEel ? Math.random() * 2.2 + 1.8 : (isCreature ? Math.random() * 0.8 + 0.6 : (Math.random() * 1.5 + (isTrash ? 0.8 : 1.2))),
                    radius: isEel ? 22 : (isCreature ? 28 : (isPowerup ? 18 : (isChest ? 22 : 18))),
                    value: isChest ? 25 : (isCreature ? 30 : (isTrash ? Math.floor(Math.random() * 5 + 3) : 15)),
                    angle: Math.random() * Math.PI * 2
                });
            }

            showModal(title, bodyHtml, buttonText, callback) {
                const modal = document.getElementById('modal-overlay');
                const titleEl = document.getElementById('modal-title');
                const bodyEl = document.getElementById('modal-body');
                const btnEl = document.getElementById('modal-action-btn');

                if (titleEl) titleEl.innerHTML = title;
                if (bodyEl) bodyEl.innerHTML = `<p class="text-sm text-slate-300 leading-relaxed">${bodyHtml}</p>`;
                if (btnEl) {
                    btnEl.innerText = buttonText;
                    btnEl.onclick = callback;
                }
                if (modal) modal.classList.remove('hidden');
            }

            closeModal() {
                const modal = document.getElementById('modal-overlay');
                if (modal) modal.classList.add('hidden');
            }

            openStationHub() {
                let html = `
                    <div class="space-y-3">
                        <div class="bg-slate-900/90 border border-cyan-500/20 p-3 rounded-2xl flex justify-between items-center">
                            <div>
                                <h4 class="text-xs font-bold text-cyan-200">Submarine Hull Health</h4>
                                <p class="text-[10px] text-slate-400">Restore your ship integrity (Cost: 15 ♻️)</p>
                            </div>
                            <button onclick="game.repairHull()" class="glow-button px-3 py-1.5 bg-rose-600 rounded-xl text-xs font-bold text-white">Repair</button>
                        </div>
                `;
                for (let key in this.upgrades) {
                    let up = this.upgrades[key];
                    let cost = Math.floor(up.cost * Math.pow(1.4, up.level - 1));
                    html += `
                        <div class="bg-slate-900/90 border border-cyan-500/20 p-3 rounded-2xl flex justify-between items-center">
                            <div>
                                <h4 class="text-xs font-bold text-cyan-200">${up.name} (Lvl ${up.level})</h4>
                                <p class="text-[10px] text-slate-400">${up.desc}</p>
                            </div>
                            <button onclick="game.upgradeItem('${key}')" class="glow-button px-3 py-1.5 bg-cyan-600 rounded-xl text-xs font-bold text-white">Upgrade (${cost} ♻️)</button>
                        </div>
                    `;
                }
                html += `</div>`;
                this.showModal("Deep Sea Station Hub", html, "Back to Base", () => this.closeModal());
            }

            repairHull() {
                if (this.trash >= 15 && this.health < this.maxHealth) {
                    this.trash -= 15;
                    this.health = this.maxHealth;
                    this.sound.playUpgrade();
                    this.updateHUD();
                    this.openStationHub();
                }
            }

            upgradeItem(key) {
                let up = this.upgrades[key];
                let cost = Math.floor(up.cost * Math.pow(1.4, up.level - 1));
                if (this.trash >= cost) {
                    this.trash -= cost;
                    up.level++;
                    this.sound.playUpgrade();
                    this.updateHUD();
                    this.openStationHub();
                }
            }

            openWardrobe() {
                let html = `<div class="grid grid-cols-2 gap-3 max-h-[350px] overflow-y-auto">`;
                for (let k in this.skins) {
                    let s = this.skins[k];
                    let isCurrent = this.currentSkin === k;
                    html += `
                        <div class="bg-slate-900/90 border ${isCurrent ? 'border-cyan-400' : 'border-slate-800'} p-3 rounded-2xl flex flex-col items-center justify-between gap-2">
                            <span class="text-xs font-bold text-cyan-200 text-center">${s.name}</span>
                            <button onclick="game.selectSkin('${k}')" class="glow-button px-3 py-1 bg-${isCurrent ? 'cyan-600' : 'slate-800'} rounded-xl text-[10px] font-bold text-white">${isCurrent ? 'Equipped' : 'Equip'}</button>
                        </div>
                    `;
                }
                html += `</div>`;
                this.showModal("Driver Suits (Unique Silhouettes)", html, "Close", () => this.closeModal());
            }

            selectSkin(k) {
                this.currentSkin = k;
                this.openWardrobe();
            }

            openWeaponWardrobe() {
                let html = `<div class="grid grid-cols-2 gap-3 max-h-[350px] overflow-y-auto">`;
                for (let k in this.weapons) {
                    let w = this.weapons[k];
                    let isCurrent = this.currentWeapon === k;
                    html += `
                        <div class="bg-slate-900/90 border ${isCurrent ? 'border-amber-400' : 'border-slate-800'} p-3 rounded-2xl flex flex-col items-center justify-between gap-2">
                            <span class="text-xs font-bold text-amber-200 text-center">${w.name}</span>
                            <span class="text-[9px] text-slate-400">Dmg: ${w.damage}</span>
                            <button onclick="game.selectWeapon('${k}')" class="glow-button px-3 py-1 bg-${isCurrent ? 'amber-600' : 'slate-800'} rounded-xl text-[10px] font-bold text-white">${isCurrent ? 'Equipped' : 'Equip (Free)'}</button>
                        </div>
                    `;
                }
                html += `</div>`;
                this.showModal("Weapon Armory (Unique Shapes & Lasers)", html, "Close", () => this.closeModal());
            }

            selectWeapon(k) {
                this.currentWeapon = k;
                this.openWeaponWardrobe();
            }

            openPetWardrobe() {
                let html = `<div class="grid grid-cols-1 gap-3 max-h-[350px] overflow-y-auto">`;
                for (let k in this.pets) {
                    let p = this.pets[k];
                    let isCurrent = this.currentPet === k;
                    html += `
                        <div class="bg-slate-900/90 border ${isCurrent ? 'border-emerald-400' : 'border-slate-800'} p-3 rounded-2xl flex justify-between items-center gap-2">
                            <div>
                                <h4 class="text-xs font-bold text-emerald-300">${p.name}</h4>
                                <p class="text-[10px] text-slate-300">✨ Perk: ${p.perk}</p>
                            </div>
                            <button onclick="game.selectPet('${k}')" class="glow-button px-3 py-1.5 bg-${isCurrent ? 'emerald-600' : 'slate-800'} rounded-xl text-[10px] font-bold text-white">${isCurrent ? 'Equipped' : 'Equip'}</button>
                        </div>
                    `;
                }
                html += `</div>`;
                this.showModal("Companion Pets & Drones Armory", html, "Close", () => this.closeModal());
            }

            selectPet(k) {
                this.currentPet = k;
                this.openPetWardrobe();
            }

            openQuests() {
                let html = `<div class="space-y-3">`;
                for (let q of this.quests) {
                    html += `
                        <div class="bg-slate-900/90 border border-amber-500/30 p-3 rounded-2xl flex justify-between items-center">
                            <div>
                                <h4 class="text-xs font-bold text-amber-200">${q.text}</h4>
                                <p class="text-[10px] text-slate-400">Progress: ${q.current}/${q.target} | Reward: +${q.reward} ♻️</p>
                            </div>
                            <span class="text-xs font-bold ${q.completed ? 'text-emerald-400' : 'text-amber-400'}">${q.completed ? 'Completed ✓' : 'In Progress'}</span>
                        </div>
                    `;
                }
                html += `</div>`;
                this.showModal("Daily Quests & Medals", html, "Close", () => this.closeModal());
            }

            endDive() {
                if (this.state !== 'DIVING') return;
                this.state = 'BASE';
                clearInterval(this.timerInterval);
                
                document.getElementById('dive-btn').classList.remove('opacity-50', 'pointer-events-none');
                document.getElementById('dive-hud').style.opacity = '0';
                document.getElementById('skill-container').classList.add('hidden');
                
                this.showModal("Dive Mission Ended", `You reached a depth of <b>${this.currentDepth}m</b> and collected <b>${this.trash} ♻️</b> recyclable resources!`, "Return to Hub", () => this.closeModal());
                this.updateHUD();
            }

            update() {
                let delta = 0.016;
                this.particles.update();

                if (this.shootCooldown > 0) this.shootCooldown--;

                for (let i = this.popups.length - 1; i >= 0; i--) {
                    let p = this.popups[i];
                    p.y -= 0.8;
                    p.alpha -= 0.02;
                    if (p.alpha <= 0) {
                        this.popups.splice(i, 1);
                    }
                }

                for (let i = this.sonarShockwaves.length - 1; i >= 0; i--) {
                    let sw = this.sonarShockwaves[i];
                    sw.currentRadius += 12;
                    sw.alpha -= 0.08;
                    if (sw.alpha <= 0 || sw.currentRadius >= sw.maxRadius) {
                        this.sonarShockwaves.splice(i, 1);
                    }
                }

                if (this.state === 'DIVING') {
                    let speedMult = 1 + (this.upgrades.thrusters.level - 1) * 0.25;
                    
                    this.sub.targetX = Math.max(30, Math.min(this.width - 30, this.sub.targetX + this.currentDrift));
                    this.sub.x += (this.sub.targetX - this.sub.x) * (this.sub.speed * speedMult);
                    this.sub.y += (this.sub.targetY - this.sub.y) * (this.sub.speed * speedMult);

                    // Smooth pet floating follow mechanics
                    let targetPetX = this.sub.x - 32;
                    let targetPetY = this.sub.y - 8 + Math.sin(Date.now() * 0.008) * 6;
                    this.petX += (targetPetX - this.petX) * 0.1;
                    this.petY += (targetPetY - this.petY) * 0.1;

                    // Pet auto-firing lasers during dives
                    this.petShootTimer += delta;
                    let activePet = this.pets[this.currentPet];
                    if (this.petShootTimer >= activePet.fireRate) {
                        this.petShootTimer = 0;
                        this.playerProjectiles.push({
                            x: this.petX,
                            y: this.petY,
                            vx: 0,
                            vy: -10,
                            radius: 4,
                            damage: 18,
                            color: activePet.color,
                            style: 'pistol',
                            isPet: true
                        });
                        this.particles.emit(this.petX, this.petY, activePet.color, 4, 3);
                    }

                    let activeSkin = this.skins[this.currentSkin];
                    if (Math.random() < 0.4) {
                        this.particles.emit(this.sub.x, this.sub.y + 20, activeSkin.trail, 1, 1);
                    }

                    // --- UPDATE PLAYER PROJECTILES ---
                    for (let i = this.playerProjectiles.length - 1; i >= 0; i--) {
                        let pp = this.playerProjectiles[i];
                        pp.x += pp.vx;
                        pp.y += pp.vy;

                        if (this.bossActive && this.boss.data) {
                            let distToBoss = Math.hypot(pp.x - this.boss.x, pp.y - this.boss.y);
                            if (distToBoss < 45) {
                                this.boss.health = Math.max(0, this.boss.health - pp.damage);
                                this.addPopup(`-${pp.damage} HP`, this.boss.x, this.boss.y, '#f43f5e');
                                this.particles.emit(pp.x, pp.y, '#f43f5e', 8, 4);
                                this.playerProjectiles.splice(i, 1);
                                continue;
                            }
                        }

                        let hitEntity = false;
                        for (let j = this.entities.length - 1; j >= 0; j--) {
                            let ent = this.entities[j];
                            let distToEnt = Math.hypot(pp.x - ent.x, pp.y - ent.y);
                            if (distToEnt < ent.radius + pp.radius) {
                                hitEntity = true;
                                if (ent.type.startsWith('trash')) {
                                    let multiplier = (this.currentPet === 'gold_bot' && ent.type === 'trash_chest') ? 2 : 1;
                                    let earned = ent.value * multiplier;
                                    this.trash += earned;
                                    this.addPopup(`+${earned} ♻️`, ent.x, ent.y, '#38bdf8');
                                    this.sound.playCollect();
                                } else {
                                    this.particles.emit(ent.x, ent.y, '#f43f5e', 12, 5);
                                    this.sound.playTone(200, 'triangle', 0.1);
                                }
                                this.entities.splice(j, 1);
                                this.spawnEntity();
                                break;
                            }
                        }

                        if (hitEntity || pp.y < -20) {
                            this.playerProjectiles.splice(i, 1);
                        }
                    }

                    // --- BOSS AI & ATTACK SYSTEM ---
                    if (this.bossActive && this.boss.data) {
                        this.boss.y += (this.boss.targetY - this.boss.y) * 0.03;
                        this.boss.x = this.width / 2 + Math.sin(Date.now() * 0.002) * 60;
                        this.boss.attackTimer += delta;

                        if (this.boss.attackTimer > this.boss.data.attackRate) {
                            this.boss.attackTimer = 0;
                            this.inkCloudAlpha = 0.6;
                            this.sound.playTone(160, 'sawtooth', 0.3);

                            let angleToSub = Math.atan2(this.sub.y - this.boss.y, this.sub.x - this.boss.x);
                            this.bossProjectiles.push({
                                x: this.boss.x,
                                y: this.boss.y + 20,
                                vx: Math.cos(angleToSub) * 4.5,
                                vy: Math.sin(angleToSub) * 4.5,
                                radius: 10
                            });
                        }

                        if (this.boss.health <= 0) {
                            this.bossActive = false;
                            this.bossProjectiles = [];
                            this.bossDefeatedDepths.add(this.boss.data.depth);
                            this.trash += this.boss.data.reward;
                            this.addPopup(`+${this.boss.data.reward} ♻️`, this.boss.x, this.boss.y, '#fbbf24');
                            this.updateQuest('survive_boss', 1);
                            this.particles.emit(this.boss.x, this.boss.y, this.boss.data.color, 60, 9);
                            this.sound.playUpgrade();
                        }
                    }

                    for (let i = this.bossProjectiles.length - 1; i >= 0; i--) {
                        let bp = this.bossProjectiles[i];
                        bp.x += bp.vx;
                        bp.y += bp.vy;

                        let distToSub = Math.hypot(this.sub.x - bp.x, this.sub.y - bp.y);
                        if (distToSub < this.sub.radius + bp.radius) {
                            if (!this.shieldActive && !this.isInvulnerable) {
                                let damageTaken = (this.currentPet === 'cobalt_droid') ? 18 : 20;
                                this.health = Math.max(0, this.health - damageTaken);
                                this.addPopup(`-${damageTaken} HP`, this.sub.x, this.sub.y, '#f43f5e');
                                this.isInvulnerable = true;
                                this.invulnerableTimer = 2.5;
                                this.particles.emit(this.sub.x, this.sub.y, '#f43f5e', 20, 6);
                                this.sound.playTone(120, 'square', 0.3);
                                if (this.health <= 0) this.endDive();
                            }
                            this.bossProjectiles.splice(i, 1);
                            continue;
                        }

                        if (bp.y > this.height + 50 || bp.y < -50 || bp.x < -50 || bp.x > this.width + 50) {
                            this.bossProjectiles.splice(i, 1);
                        }
                    }

                    if (this.inkCloudAlpha > 0) {
                        this.inkCloudAlpha -= delta * 0.3;
                    }

                    if (this.isInvulnerable) {
                        this.invulnerableTimer -= delta;
                        if (this.invulnerableTimer <= 0) {
                            this.isInvulnerable = false;
                            this.invulnerableTimer = 0;
                        }
                    }

                    if (this.magnetTimer > 0) {
                        this.magnetTimer -= delta;
                        if (this.magnetTimer <= 0) this.magnetTimer = 0;
                        this.updateHUD();
                    }

                    if (this.timeSlowTimer > 0) {
                        this.timeSlowTimer -= delta;
                        if (this.timeSlowTimer <= 0) this.timeSlowTimer = 0;
                        this.updateHUD();
                    }

                    for (let i = this.entities.length - 1; i >= 0; i--) {
                        let ent = this.entities[i];

                        let slowFactor = (this.timeSlowTimer > 0 && !ent.type.startsWith('trash')) ? 0.3 : (this.currentPet === 'toxic_slime' && !ent.type.startsWith('trash') ? 0.75 : 1.0);
                        ent.y -= ent.speed * slowFactor;

                        if (ent.type === 'enemy_eel') {
                            ent.x += Math.sin(Date.now() * 0.006) * 3;
                        }

                        if ((this.magnetTimer > 0 || this.currentPet === 'phantom_eye') && ent.type.startsWith('trash')) {
                            let pullSpeed = this.currentPet === 'phantom_eye' ? 4 : 5;
                            let angle = Math.atan2(this.sub.y - ent.y, this.sub.x - ent.x);
                            ent.x += Math.cos(angle) * pullSpeed;
                            ent.y += Math.sin(angle) * pullSpeed;
                        }

                        if (ent.y < -30) {
                            this.entities.splice(i, 1);
                            this.spawnEntity();
                            continue;
                        }

                        let netRadius = this.sub.radius + 15 + (this.upgrades.netSize.level - 1) * 8 + (this.currentPet === 'phantom_eye' ? 20 : 0);
                        let dist = Math.hypot(this.sub.x - ent.x, this.sub.y - ent.y);
                        
                        if (dist < netRadius + ent.radius) {
                            if (ent.type.startsWith('trash')) {
                                this.combo++;
                                this.comboMultiplier = 1 + Math.floor(this.combo / 5) * 0.5;
                                let comboEl = document.getElementById('combo-text');
                                if (comboEl) comboEl.innerText = `${this.comboMultiplier}x Combo`;

                                let multiplier = (this.currentPet === 'gold_bot' && ent.type === 'trash_chest') ? 2 : 1;
                                let earned = Math.floor(ent.value * this.comboMultiplier * multiplier);
                                this.trash += earned;
                                this.addPopup(`+${earned} ♻️`, ent.x, ent.y, ent.type === 'trash_chest' ? '#fbbf24' : '#38bdf8');
                                this.updateQuest('collect_trash', 1);
                                this.particles.emit(ent.x, ent.y, ent.type === 'trash_chest' ? '#fbbf24' : '#38bdf8', 12, 4);
                                this.sound.playCollect();
                            } else if (ent.type.startsWith('powerup')) {
                                if (ent.type === 'powerup_magnet') {
                                    this.magnetTimer = 8;
                                    this.addPopup(`🧲 MAGNET!`, ent.x, ent.y, '#06b6d4');
                                } else if (ent.type === 'powerup_timeslow') {
                                    this.timeSlowTimer = 8;
                                    this.addPopup(`⏱️ SLOW MOTION!`, ent.x, ent.y, '#a855f7');
                                } else if (ent.type === 'powerup_repair') {
                                    this.health = Math.min(this.maxHealth, this.health + 25);
                                    this.addPopup(`+25 HP`, ent.x, ent.y, '#10b981');
                                }
                                this.particles.emit(ent.x, ent.y, '#10b981', 15, 4);
                                this.sound.playPowerup();
                            } else {
                                this.combo = 0;
                                this.comboMultiplier = 1;
                                let comboEl = document.getElementById('combo-text');
                                if (comboEl) comboEl.innerText = `1x Combo`;

                                if (this.currentPet === 'crimson_bat' && ent.type.startsWith('hazard')) {
                                    let earned = 15;
                                    this.trash += earned;
                                    this.addPopup(`+${earned} ♻️ (Bat Perk)`, ent.x, ent.y, '#dc2626');
                                    this.particles.emit(ent.x, ent.y, '#dc2626', 15, 4);
                                    this.sound.playCollect();
                                } else if (!this.shieldActive && !this.isInvulnerable) {
                                    let damageTaken = (this.currentPet === 'cobalt_droid') ? Math.max(5, ent.value - 3) : ent.value;
                                    this.health = Math.max(0, this.health - damageTaken);
                                    this.addPopup(`-${damageTaken} HP`, ent.x, ent.y, '#f43f5e');
                                    this.particles.emit(ent.x, ent.y, '#f43f5e', 16, 5);
                                    this.sound.playTone(150, 'sawtooth', 0.25);

                                    this.isInvulnerable = true;
                                    this.invulnerableTimer = 3.0;

                                    if (this.health <= 0) {
                                        this.endDive();
                                    }
                                } else {
                                    this.particles.emit(ent.x, ent.y, '#fbbf24', 12, 4);
                                    this.sound.playTone(600, 'sine', 0.1);
                                }
                            }
                            this.entities.splice(i, 1);
                            this.spawnEntity();
                            this.updateHUD();
                        }
                    }
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                // --- DRAW ACTIVE BOSS ---
                if (this.bossActive && this.boss.data) {
                    this.ctx.save();
                    let t = Date.now() * 0.003;
                    let b = this.boss.data;
                    
                    for (let i = -3; i <= 3; i++) {
                        let offset = i * 16;
                        this.ctx.strokeStyle = b.glow;
                        this.ctx.lineWidth = 7 - Math.abs(i);
                        this.ctx.beginPath();
                        this.ctx.moveTo(this.boss.x + offset, this.boss.y + 15);
                        let curveX = this.boss.x + offset + Math.sin(t + i) * 25;
                        let curveY = this.boss.y + 65;
                        let endX = this.boss.x + offset * 1.5 + Math.cos(t * 1.5 + i) * 30;
                        let endY = this.boss.y + 110;
                        this.ctx.quadraticCurveTo(curveX, curveY, endX, endY);
                        this.ctx.stroke();
                    }

                    this.ctx.shadowColor = b.glow;
                    this.ctx.shadowBlur = 24;
                    let grad = this.ctx.createRadialGradient(this.boss.x - 10, this.boss.y - 10, 5, this.boss.x, this.boss.y, 44);
                    grad.addColorStop(0, b.color);
                    grad.addColorStop(0.7, b.glow);
                    grad.addColorStop(1, '#0f172a');
                    
                    this.ctx.fillStyle = grad;
                    this.ctx.beginPath();
                    this.ctx.ellipse(this.boss.x, this.boss.y, 42, 34, 0, Math.PI, 0, false);
                    this.ctx.fill();

                    this.ctx.fillStyle = '#f43f5e';
                    this.ctx.shadowColor = '#f43f5e';
                    this.ctx.shadowBlur = 15;
                    this.ctx.beginPath();
                    this.ctx.arc(this.boss.x - 14, this.boss.y - 6, 4.5, 0, Math.PI * 2);
                    this.ctx.arc(this.boss.x + 14, this.boss.y - 6, 4.5, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 11px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(`${b.name} (${b.depth}m)`, this.boss.x, this.boss.y - 60);

                    this.ctx.fillStyle = '#334155';
                    this.ctx.fillRect(this.boss.x - 45, this.boss.y - 50, 90, 8);
                    this.ctx.fillStyle = '#f43f5e';
                    this.ctx.fillRect(this.boss.x - 45, this.boss.y - 50, 90 * (this.boss.health / this.boss.maxHealth), 8);
                    this.ctx.restore();
                }

                // --- DRAW BOSS PROJECTILES ---
                for (let bp of this.bossProjectiles) {
                    this.ctx.save();
                    this.ctx.shadowColor = '#f43f5e';
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillStyle = '#ef4444';
                    this.ctx.beginPath();
                    this.ctx.arc(bp.x, bp.y, bp.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.fillStyle = '#fecaca';
                    this.ctx.beginPath();
                    this.ctx.arc(bp.x, bp.y, bp.radius / 2, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }

                // --- DRAW UNIQUE PLAYER & PET PROJECTILES ---
                for (let pp of this.playerProjectiles) {
                    this.ctx.save();
                    this.ctx.shadowColor = pp.color;
                    this.ctx.shadowBlur = 14;
                    this.ctx.fillStyle = pp.color;
                    this.ctx.strokeStyle = '#ffffff';

                    if (pp.style === 'rifle' || pp.style === 'railgun') {
                        this.ctx.lineWidth = pp.style === 'railgun' ? 5 : 3;
                        this.ctx.beginPath();
                        this.ctx.moveTo(pp.x, pp.y + 14);
                        this.ctx.lineTo(pp.x, pp.y - 14);
                        this.ctx.stroke();
                    } else if (pp.style === 'ring' || pp.style === 'annihilator') {
                        this.ctx.lineWidth = 3;
                        this.ctx.beginPath();
                        this.ctx.arc(pp.x, pp.y, pp.radius + 3, 0, Math.PI * 2);
                        this.ctx.stroke();
                    } else if (pp.style === 'trident' || pp.style === 'crossbow') {
                        this.ctx.beginPath();
                        this.ctx.moveTo(pp.x, pp.y - pp.radius - 4);
                        this.ctx.lineTo(pp.x + pp.radius - 1, pp.y + pp.radius);
                        this.ctx.lineTo(pp.x - pp.radius + 1, pp.y + pp.radius);
                        this.ctx.closePath();
                        this.ctx.fill();
                    } else if (pp.style === 'shard' || pp.style === 'pod') {
                        this.ctx.beginPath();
                        this.ctx.moveTo(pp.x, pp.y - pp.radius - 2);
                        this.ctx.lineTo(pp.x + pp.radius, pp.y);
                        this.ctx.lineTo(pp.x, pp.y + pp.radius + 2);
                        this.ctx.lineTo(pp.x - pp.radius, pp.y);
                        this.ctx.closePath();
                        this.ctx.fill();
                    } else {
                        this.ctx.beginPath();
                        this.ctx.arc(pp.x, pp.y, pp.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    this.ctx.restore();
                }

                // --- DRAW ENTITIES WITH LABELS ---
                for (let ent of this.entities) {
                    this.ctx.save();
                    let t = Date.now() * 0.004;

                    if (ent.type.startsWith('trash')) {
                        this.ctx.fillStyle = ent.type === 'trash_chest' ? '#fbbf24' : '#38bdf8';
                        this.ctx.beginPath();
                        this.ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = '14px Fredoka';
                        this.ctx.textAlign = 'center';
                        this.ctx.textBaseline = 'middle';
                        this.ctx.fillText(ent.type === 'trash_chest' ? '💎' : '♻️', ent.x, ent.y);
                    } else if (ent.type.startsWith('powerup')) {
                        let pColor = ent.type === 'powerup_magnet' ? '#06b6d4' : (ent.type === 'powerup_repair' ? '#10b981' : '#a855f7');
                        this.ctx.shadowColor = pColor;
                        this.ctx.shadowBlur = 15;
                        this.ctx.fillStyle = pColor;
                        this.ctx.beginPath();
                        this.ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = '14px Fredoka';
                        this.ctx.textAlign = 'center';
                        this.ctx.textBaseline = 'middle';
                        let icon = ent.type === 'powerup_magnet' ? '🧲' : (ent.type === 'powerup_repair' ? '💚' : '⏱️');
                        this.ctx.fillText(icon, ent.x, ent.y);
                    } else {
                        let labelName = "HAZARD";
                        let labelColor = "#f43f5e";

                        if (ent.type === 'enemy_eel') {
                            labelName = "⚡ DANGER EEL";
                            this.ctx.shadowColor = '#eab308';
                            this.ctx.shadowBlur = 14;
                            this.ctx.strokeStyle = '#facc15';
                            this.ctx.lineWidth = 4;
                            this.ctx.beginPath();
                            this.ctx.moveTo(ent.x, ent.y - 20);
                            this.ctx.quadraticCurveTo(ent.x + 15, ent.y, ent.x, ent.y + 20);
                            this.ctx.stroke();
                            this.ctx.fillStyle = '#ca8a04';
                            this.ctx.beginPath();
                            this.ctx.arc(ent.x, ent.y - 16, 5, 0, Math.PI * 2);
                            this.ctx.fill();
                        } else if (ent.type === 'enemy_urchin') {
                            labelName = "☣️ TOXIC URCHIN";
                            this.ctx.shadowColor = '#22c55e';
                            this.ctx.shadowBlur = 12;
                            this.ctx.fillStyle = '#14532d';
                            this.ctx.strokeStyle = '#4ade80';
                            this.ctx.lineWidth = 2;
                            this.ctx.beginPath();
                            this.ctx.arc(ent.x, ent.y, 16, 0, Math.PI * 2);
                            this.ctx.fill();
                            this.ctx.stroke();
                            for(let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                                this.ctx.beginPath();
                                this.ctx.moveTo(ent.x, ent.y);
                                this.ctx.lineTo(ent.x + Math.cos(a) * 22, ent.y + Math.sin(a) * 22);
                                this.ctx.stroke();
                            }
                        } else if (ent.type === 'hazard_mine') {
                            labelName = "⚠️ SEA MINE";
                            this.ctx.shadowColor = '#f43f5e';
                            this.ctx.shadowBlur = 16;
                            this.ctx.strokeStyle = '#cbd5e1';
                            this.ctx.lineWidth = 3;
                            for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
                                this.ctx.beginPath();
                                this.ctx.moveTo(ent.x, ent.y);
                                this.ctx.lineTo(ent.x + Math.cos(a) * 18, ent.y + Math.sin(a) * 18);
                                this.ctx.stroke();
                            }
                            let mineGrad = this.ctx.createRadialGradient(ent.x - 4, ent.y - 4, 2, ent.x, ent.y, 12);
                            mineGrad.addColorStop(0, '#f43f5e');
                            mineGrad.addColorStop(1, '#881337');
                            this.ctx.fillStyle = mineGrad;
                            this.ctx.beginPath();
                            this.ctx.arc(ent.x, ent.y, 11, 0, Math.PI * 2);
                            this.ctx.fill();
                            let blink = Math.floor(Date.now() / 250) % 2;
                            this.ctx.fillStyle = blink === 0 ? '#ff0000' : '#ff7777';
                            this.ctx.beginPath();
                            this.ctx.arc(ent.x, ent.y, 3.5, 0, Math.PI * 2);
                            this.ctx.fill();
                        } else if (ent.type === 'hazard_waste') {
                            labelName = "☢️ TOXIC WASTE";
                            this.ctx.shadowColor = '#10b981';
                            this.ctx.shadowBlur = 14;
                            this.ctx.fillStyle = '#065f46';
                            this.ctx.strokeStyle = '#34d399';
                            this.ctx.lineWidth = 2;
                            this.ctx.beginPath();
                            this.ctx.roundRect(ent.x - 12, ent.y - 15, 24, 30, 6);
                            this.ctx.fill();
                            this.ctx.stroke();
                            this.ctx.fillStyle = '#fbbf24';
                            this.ctx.font = '12px Fredoka';
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';
                            this.ctx.fillText('☣️', ent.x, ent.y);
                        } else {
                            labelName = "🦑 CREATURE";
                            if (ent.type === 'creature_squid') {
                                this.ctx.shadowColor = '#a855f7';
                                this.ctx.shadowBlur = 12;
                                for (let k = -2; k <= 2; k++) {
                                    this.ctx.strokeStyle = '#c084fc';
                                    this.ctx.lineWidth = 3;
                                    this.ctx.beginPath();
                                    this.ctx.moveTo(ent.x + k * 5, ent.y + 6);
                                    this.ctx.quadraticCurveTo(ent.x + k * 12 + Math.sin(t + k) * 10, ent.y + 20, ent.x + k * 8, ent.y + 32);
                                    this.ctx.stroke();
                                }
                                this.ctx.fillStyle = '#7e22ce';
                                this.ctx.beginPath();
                                this.ctx.ellipse(ent.x, ent.y, 14, 18, 0, 0, Math.PI * 2);
                                this.ctx.fill();
                            } else {
                                this.ctx.shadowColor = '#38bdf8';
                                this.ctx.shadowBlur = 12;
                                this.ctx.fillStyle = '#1e293b';
                                this.ctx.strokeStyle = '#38bdf8';
                                this.ctx.lineWidth = 2;
                                this.ctx.beginPath();
                                this.ctx.ellipse(ent.x, ent.y, 20, 13, 0, 0, Math.PI * 2);
                                this.ctx.fill();
                                this.ctx.stroke();
                            }
                        }

                        this.ctx.fillStyle = labelColor;
                        this.ctx.font = 'bold 9px Fredoka';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText(labelName, ent.x, ent.y - ent.radius - 8);
                    }
                    this.ctx.restore();
                }

                if (this.inkCloudAlpha > 0) {
                    this.ctx.save();
                    this.ctx.fillStyle = `rgba(15, 23, 42, ${this.inkCloudAlpha})`;
                    this.ctx.fillRect(0, 0, this.width, this.height);
                    this.ctx.restore();
                }

                for (let sw of this.sonarShockwaves) {
                    this.ctx.save();
                    this.ctx.strokeStyle = `rgba(251, 191, 36, ${sw.alpha})`;
                    this.ctx.fillStyle = `rgba(251, 191, 36, ${sw.alpha * 0.15})`;
                    this.ctx.lineWidth = 6;
                    this.ctx.shadowColor = '#fbbf24';
                    this.ctx.shadowBlur = 20;
                    this.ctx.beginPath();
                    this.ctx.arc(sw.x, sw.y, sw.currentRadius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.restore();
                }

                for (let pop of this.popups) {
                    this.ctx.save();
                    this.ctx.globalAlpha = Math.max(0, pop.alpha);
                    this.ctx.fillStyle = pop.color;
                    this.ctx.shadowColor = pop.color;
                    this.ctx.shadowBlur = 10;
                    this.ctx.font = 'bold 13px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(pop.text, pop.x, pop.y);
                    this.ctx.restore();
                }

                // ==========================================================================
                // DRAW ACTIVE COMPANION PET / DRONE DURING DIVES
                // ==========================================================================
                if (this.state === 'DIVING') {
                    const activePet = this.pets[this.currentPet];
                    this.ctx.save();
                    this.ctx.shadowColor = activePet.color;
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillStyle = activePet.color;
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;

                    this.ctx.beginPath();
                    this.ctx.arc(this.petX, this.petY, 12, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.stroke();

                    // Inner glowing core
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.beginPath();
                    this.ctx.arc(this.petX, this.petY, 4, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Pet Name Tag
                    this.ctx.fillStyle = activePet.color;
                    this.ctx.font = 'bold 8px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(activePet.name.split(' ')[0], this.petX, this.petY - 16);
                    this.ctx.restore();
                }

                // ==========================================================================
                // DRAW UNIQUE DRIVER SUIT & WEAPON GEOMETRY
                // ==========================================================================
                const skin = this.skins[this.currentSkin];
                const weapon = this.weapons[this.currentWeapon];
                this.ctx.save();

                if (this.isInvulnerable) {
                    let flash = Math.floor(Date.now() / 100) % 2;
                    this.ctx.globalAlpha = flash === 0 ? 0.4 : 0.8;
                }

                this.ctx.shadowColor = skin.primary;
                this.ctx.shadowBlur = 18;

                const bx = this.sub.x;
                const by = this.sub.y;
                const t = Date.now() * 0.005;

                let armSwimLeft = Math.sin(t) * 8;
                let armSwimRight = -Math.sin(t) * 8;

                let bodyStyle = skin.bodyStyle;

                // Arms
                this.ctx.strokeStyle = skin.primary;
                this.ctx.lineWidth = bodyStyle === 'heavy' || bodyStyle === 'juggernaut' ? 6 : 4;
                this.ctx.beginPath();
                this.ctx.moveTo(bx - 14, by + 4);
                this.ctx.lineTo(bx - 26, by + 12 + armSwimLeft);
                this.ctx.stroke();

                this.ctx.fillStyle = skin.accent;
                this.ctx.beginPath();
                this.ctx.arc(bx - 27, by + 13 + armSwimLeft, bodyStyle === 'heavy' ? 5 : 3.5, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.beginPath();
                this.ctx.moveTo(bx + 14, by + 4);
                this.ctx.lineTo(bx + 26, by + 12 + armSwimRight);
                this.ctx.stroke();

                this.ctx.fillStyle = skin.accent;
                this.ctx.beginPath();
                this.ctx.arc(bx + 27, by + 13 + armSwimRight, bodyStyle === 'heavy' ? 5 : 3.5, 0, Math.PI * 2);
                this.ctx.fill();

                // --- DRAW UNIQUE WEAPON SHAPES HELD IN HAND ---
                this.ctx.save();
                this.ctx.shadowColor = weapon.color;
                this.ctx.shadowBlur = 16;
                this.ctx.translate(bx + 22, by + 4 + armSwimRight);

                let wStyle = weapon.style;
                if (wStyle === 'rifle') {
                    this.ctx.fillStyle = '#1e293b';
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.roundRect(-3, -22, 6, 32, 2);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.fillStyle = weapon.color;
                    this.ctx.fillRect(-1, -26, 2, 6);
                } else if (wStyle === 'gatling') {
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.roundRect(-6, -14, 12, 22, 4);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.fillStyle = weapon.color;
                    this.ctx.fillRect(-4, -20, 2, 8);
                    this.ctx.fillRect(2, -20, 2, 8);
                } else if (wStyle === 'trident') {
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 12);
                    this.ctx.lineTo(0, -20);
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.moveTo(-6, -14); this.ctx.lineTo(0, -24); this.ctx.lineTo(6, -14);
                    this.ctx.stroke();
                } else if (wStyle === 'ring' || wStyle === 'annihilator') {
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.arc(0, -8, 8, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.fillStyle = weapon.color;
                    this.ctx.beginPath();
                    this.ctx.arc(0, -8, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                } else if (wStyle === 'megaphone' || wStyle === 'heavy_cannon') {
                    this.ctx.fillStyle = '#1e293b';
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(-6, 8);
                    this.ctx.lineTo(-10, -14);
                    this.ctx.lineTo(10, -14);
                    this.ctx.lineTo(6, 8);
                    this.ctx.closePath();
                    this.ctx.fill();
                    this.ctx.stroke();
                } else if (wStyle === 'crossbow') {
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.fillRect(-2, -10, 4, 18);
                    this.ctx.beginPath();
                    this.ctx.moveTo(-12, -4);
                    this.ctx.lineTo(0, -10);
                    this.ctx.lineTo(12, -4);
                    this.ctx.stroke();
                } else if (wStyle === 'railgun') {
                    this.ctx.fillStyle = '#334155';
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 3;
                    this.ctx.fillRect(-6, -18, 4, 26);
                    this.ctx.fillRect(2, -18, 4, 26);
                    this.ctx.fillStyle = weapon.color;
                    this.ctx.fillRect(-2, -22, 4, 8);
                } else {
                    this.ctx.fillStyle = '#1e293b';
                    this.ctx.strokeStyle = weapon.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.roundRect(-4, -6, 12, 22, 4);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.fillStyle = weapon.color;
                    this.ctx.fillRect(1, -12, 2, 8);
                }

                this.ctx.restore();

                // Torso
                if (bodyStyle === 'heavy' || bodyStyle === 'juggernaut') {
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.strokeStyle = skin.primary;
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.moveTo(bx - 18, by + 4);
                    this.ctx.lineTo(bx + 18, by + 4);
                    this.ctx.lineTo(bx + 14, by + 32);
                    this.ctx.lineTo(bx - 14, by + 32);
                    this.ctx.closePath();
                    this.ctx.fill();
                    this.ctx.stroke();
                } else if (bodyStyle === 'sleek' || bodyStyle === 'winged') {
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.strokeStyle = skin.primary;
                    this.ctx.lineWidth = 2.5;
                    this.ctx.beginPath();
                    this.ctx.roundRect(bx - 10, by + 6, 20, 24, 10);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.fillStyle = skin.accent;
                    this.ctx.beginPath();
                    this.ctx.moveTo(bx - 10, by + 16);
                    this.ctx.lineTo(bx - 20, by + 22);
                    this.ctx.lineTo(bx - 10, by + 26);
                    this.ctx.moveTo(bx + 10, by + 16);
                    this.ctx.lineTo(bx + 20, by + 22);
                    this.ctx.lineTo(bx + 10, by + 26);
                    this.ctx.fill();
                } else {
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.strokeStyle = skin.primary;
                    this.ctx.lineWidth = 2.5;
                    this.ctx.beginPath();
                    this.ctx.roundRect(bx - 12, by + 8, 24, 22, 8);
                    this.ctx.fill();
                    this.ctx.stroke();
                }

                this.ctx.fillStyle = skin.primary;
                this.ctx.beginPath();
                this.ctx.arc(bx, by + 18, bodyStyle === 'heavy' ? 6 : 4, 0, Math.PI * 2);
                this.ctx.fill();

                let legSwimLeft = Math.cos(t * 1.5) * 6;
                let legSwimRight = -Math.cos(t * 1.5) * 6;

                this.ctx.strokeStyle = skin.primary;
                this.ctx.lineWidth = bodyStyle === 'heavy' ? 5 : 3.5;
                this.ctx.beginPath();
                this.ctx.moveTo(bx - 6, by + 30);
                this.ctx.lineTo(bx - 8, by + 42 + legSwimLeft);
                this.ctx.moveTo(bx + 6, by + 30);
                this.ctx.lineTo(bx + 8, by + 42 + legSwimRight);
                this.ctx.stroke();

                this.ctx.fillStyle = skin.accent;
                this.ctx.beginPath();
                this.ctx.ellipse(bx - 10, by + 46 + legSwimLeft, 4, 10, Math.PI / 6, 0, Math.PI * 2);
                this.ctx.ellipse(bx + 10, by + 46 + legSwimRight, 4, 10, -Math.PI / 6, 0, Math.PI * 2);
                this.ctx.fill();

                // Helmet
                this.ctx.fillStyle = '#0f172a';
                this.ctx.strokeStyle = skin.primary;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                
                if (bodyStyle === 'heavy' || bodyStyle === 'juggernaut') {
                    this.ctx.roundRect(bx - 15, by - 16, 30, 24, 4);
                } else if (bodyStyle === 'stealth' || bodyStyle === 'cyber') {
                    this.ctx.moveTo(bx, by - 22);
                    this.ctx.lineTo(bx + 14, by - 8);
                    this.ctx.lineTo(bx + 12, by + 4);
                    this.ctx.lineTo(bx - 12, by + 4);
                    this.ctx.lineTo(bx - 14, by - 8);
                    this.ctx.closePath();
                } else {
                    this.ctx.arc(bx, by - 4, this.sub.radius - 4, 0, Math.PI * 2);
                }
                this.ctx.fill();
                this.ctx.stroke();

                this.ctx.fillStyle = skin.bodyStyle === 'stealth' ? '#10b981' : '#0284c7';
                this.ctx.beginPath();
                this.ctx.roundRect(bx - 11, by - 10, 22, 12, 5);
                this.ctx.fill();

                this.ctx.fillStyle = skin.accent;
                this.ctx.shadowColor = skin.accent;
                this.ctx.shadowBlur = 10;
                this.ctx.beginPath();
                this.ctx.arc(bx - 16, by - 12, 3.5, 0, Math.PI * 2);
                this.ctx.arc(bx + 16, by - 12, 3.5, 0, Math.PI * 2);
                this.ctx.fill();

                if (this.shieldActive || this.isInvulnerable) {
                    this.ctx.strokeStyle = this.shieldActive ? '#fbbf24' : skin.primary;
                    this.ctx.lineWidth = 3;
                    this.ctx.shadowColor = this.shieldActive ? '#fbbf24' : skin.primary;
                    this.ctx.shadowBlur = 20;
                    this.ctx.beginPath();
                    this.ctx.arc(bx, by + 12, this.sub.radius + 22, 0, Math.PI * 2);
                    this.ctx.stroke();
                }

                if (this.state === 'DIVING') {
                    let netRadius = this.sub.radius + 15 + (this.upgrades.netSize.level - 1) * 8;
                    this.ctx.strokeStyle = `${skin.primary}66`;
                    this.ctx.lineWidth = 2;
                    this.ctx.setLineDash([4, 4]);
                    this.ctx.beginPath();
                    this.ctx.arc(bx, by + 8, netRadius, 0, Math.PI * 2);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }

                this.ctx.restore();
                this.particles.draw(this.ctx);
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        let game;
        window.onload = () => {
            game = new EcoDeepGame();
        };
    </script>
</body>
</html>
